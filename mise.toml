[tools]
rust = "1.98.0"
node = "24.20.0"
"npm:@tailwindcss/cli" = "4.1.17"
"cargo:cargo-watch" = "8.5.3"
"cargo:sqlx-cli" = "0.9.0"

[tasks.css]
description = "Build the Tailwind stylesheet"
run = "tailwindcss --input static/tailwind.input.css --output static/tailwind.css --minify"

[tasks.format]
description = "Format Rust code"
run = "cargo fmt"

[tasks.lint]
description = "Lint Rust code"
run = "cargo clippy --all-targets --all-features -- -D warnings"

[tasks.test]
description = "Run the test suite"
run = "cargo test --all-features"

[tasks.check]
description = "Run all CI checks"
run = '''
cargo fmt --check
cargo clippy --all-targets --all-features -- -D warnings
cargo check --all-targets --all-features
cargo test --all-features
'''

[tasks.dev]
description = "Start the app and rebuild CSS on changes"
run = '''
tailwindcss --input static/tailwind.input.css --output static/tailwind.css || exit $?
tailwindcss --input static/tailwind.input.css --output static/tailwind.css --watch=always &
css_watch_pid=$!
trap 'kill "$css_watch_pid"' EXIT INT TERM
cargo watch -x run
'''

[tasks.container]
description = "Build the production container image with Podman"
run = "podman build --tag omfj.no ."

[tasks."db:setup"]
description = "Set up the database"
run = '''
sqlx database setup
'''

[tasks."db:reset"]
description = "Reset the database"
run = '''
sqlx database reset
'''

[tasks."db:migrate"]
description = "Run database migrations"
run = '''
sqlx migrate run
'''

[tasks."db:offline"]
description = "Generate an offline queries"
run = '''
sqlx prepare --check --all-targets --all-features
'''
