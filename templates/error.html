{% extends "base.html" %}
{% block title %}{{ status }} — {{ title }}{% endblock %}
{% block content %}
  <main class="flex min-h-[55vh] items-center">
    <section class="w-full pl-5" aria-labelledby="error-title">
      <p class="text-foreground-muted text-sm">status {{ status }}</p>
      <h1 id="error-title" class="mt-2 text-xl">{{ title }}</h1>
      <p class="mt-3 max-w-md text-foreground-muted">{{ message }}</p>
      <div class="mt-6 flex flex-wrap gap-4">
        <a href="/" class="link">&lt;- Home</a>
      </div>
    </section>
  </main>
{% endblock %}
